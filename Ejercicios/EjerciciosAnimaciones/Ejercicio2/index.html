<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Etiqueta viewport necesaria para diseño adaptable y media queries según los apuntes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum de imágenes</title>
    <!-- Enlace a Google Fonts para la fuente Outfit según los apuntes -->
    <link href="https://fonts.googleapis.com/css?family=Outfit&display=swap" rel="stylesheet">
    <!-- Enlace a nuestra hoja de estilos externa -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- Contenedor de la cuadrícula de 4 columnas en 2 filas (Grid) -->
    <main class="album">

        <!-- Cada tarjeta/caja del álbum contiene una imagen y su texto -->
        <article class="tarjeta">
            <img src="imagenes/am.jpg" alt="A.M.">
            <p>A.M.</p>
        </article>

        <article class="tarjeta">
            <img src="imagenes/beingthere.jpg" alt="Being There">
            <p>Being There</p>
        </article>

        <article class="tarjeta">
            <img src="imagenes/mermaidavenue.jpg" alt="Mermaid Avenue I">
            <p>Mermaid Avenue I</p>
        </article>

        <article class="tarjeta">
            <img src="imagenes/yanke.jpg" alt="Yankee Hotel Foxtrot">
            <p>Yankee Hotel Foxtrot</p>
        </article>

        <article class="tarjeta">
            <img src="imagenes/skybluesky.jpg" alt="Sky Blue Sky">
            <p>Sky Blue Sky</p>
        </article>

        <article class="tarjeta">
            <img src="imagenes/starwars.jpg" alt="Star Wars">
            <p>Star Wars</p>
        </article>

        <article class="tarjeta">
            <img src="imagenes/summerteeth.jpg" alt="Summerteeth">
            <p>Summerteeth</p>
        </article>

        <article class="tarjeta">
            <img src="imagenes/wilco.jpg" alt="Wilco The album">
            <p>Wilco The album</p>
        </article>

    </main>

</body>
</html>
