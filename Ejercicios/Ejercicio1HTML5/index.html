<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <!-- Fuente Inter recomendada en el ejercicio y apuntes -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <main class="contenedor-formulario">
        <header class="encabezado-formulario">
            <h1>Formulario de Registro</h1>
            <p>Completa la información solicitada.</p>
        </header>

        <form action="#">
            
            <!-- 2. Agrupación: Datos personales -->
            <fieldset>
                <legend>Datos personales</legend>

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre">

                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" name="apellidos" placeholder="Escribe tus apellidos">

                <label for="dni">DNI</label>
                <input type="text" id="dni" name="dni" placeholder="12345678A" pattern="[0-9]{8}[A-Za-z]">

                <label for="fecha_nacimiento">Fecha de nacimiento</label>
                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>

                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="600123123">
            </fieldset>

            <!-- 2. Agrupación: Datos de usuario -->
            <fieldset>
                <legend>Datos de usuario</legend>

                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="correo@dominio.com">

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>

                <label for="confirm_password">Confirmar contraseña</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </fieldset>

            <!-- 2. Agrupación: Datos de la web -->
            <fieldset>
                <legend>Datos de la web</legend>

                <label for="web">Nombre de la web</label>
                <input type="url" id="web" name="web" placeholder="https://www.misitio.com">

                <label for="color">Color principal</label>
                <input type="color" id="color" name="color" value="#000000">

                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion" rows="4" placeholder="Describe tu proyecto web"></textarea>
            </fieldset>

            <!-- 8. Botón de envío -->
            <button type="submit" class="btn-enviar">Crear cuenta</button>

        </form>
        
    </main>

</body>
</html>
