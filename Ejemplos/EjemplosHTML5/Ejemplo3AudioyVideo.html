<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Ejemplo de vídeo y audio</title>
	<style>
		body {
			background: #dad5d8;
			margin: 40px;
		}

		main {
			max-width: 540px;
			margin: auto;
		}

		figure {
			margin: 0 0 30px;
		}

		figcaption {
			margin-top: 8px;
		}

		video {
			display: block;
			width: 100%;
			height: auto;
			aspect-ratio: 3 / 2; /* proporción original: 540 x 360 */
			background: #000;
		}

		audio {
			display: block;
			width: 100%;
		}
	</style>
</head>
<body>
	<header>
		<h1>Cóndores y música</h1>
	</header>

	<main>
		<figure>
			<video controls loop playsinline preload="metadata">
				<source src="condores.mp4" type="video/mp4">
				<!-- Alternativa para navegadores sin soporte de vídeo -->
				<p>
					Tu navegador no soporta vídeo HTML5.
					<a href="condores.mp4">Descarga el vídeo</a>.
				</p>
			</video>
			<figcaption>Vuelo de cóndores</figcaption>
		</figure>

		<figure>
			<figcaption>Banda sonora: <cite>Me and the Eagle</cite></figcaption>
			<audio controls preload="none">
				<source src="MeAndTheEagle.mp3" type="audio/mpeg">
				<!-- Alternativa para navegadores sin soporte de audio -->
				<p>
					Tu navegador no soporta audio HTML5.
					<a href="MeAndTheEagle.mp3">Descarga el audio</a>.
				</p>
			</audio>
		</figure>
	</main>
</body>
</html>
